name: Build SWD PRM Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable app
        run: npm run dist
      - name: Upload Windows app files
        uses: actions/upload-artifact@v4
        with:
          name: SWD-PRM-Windows-App
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
